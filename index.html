<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USI Tools — Unnamed Space Idle Utilities</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>USI&nbsp;Tools</h1>
      <p class="tagline">A collection of utilities for
        <a href="https://spaceidle.game-vault.net/wiki/Main_Page" target="_blank" rel="noopener">Unnamed Space Idle</a>.
      </p>
    </div>
  </header>

  <main class="wrap">
    <section aria-labelledby="tools-heading">
      <h2 id="tools-heading">Tools</h2>
      <div id="tool-grid" class="tool-grid">
        <!-- Tool cards are rendered by js/main.js -->
      </div>
      <p id="empty-state" class="empty-state" hidden>
        No tools yet — they'll appear here as they're built.
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Unofficial fan-made utilities. Not affiliated with the developers of Unnamed Space Idle.</p>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
